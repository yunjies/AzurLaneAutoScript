version: "3.8"

services:
  alas-mcp:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: alas-mcp:latest
    container_name: alas-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ===== 必须修改：换成你的 Windows PC 的 IP =====
      - ALAS_API_BASE=http://192.168.1.100:22267
      - EMULATOR_API_BASE=http://192.168.1.100:22333
      # ==============================================
    networks:
      - alas-net

networks:
  alas-net:
    driver: bridge
